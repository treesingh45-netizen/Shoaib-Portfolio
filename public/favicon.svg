<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b67c46" />
      <stop offset="50%" stop-color="#a06634" />
      <stop offset="100%" stop-color="#845024" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#a06634" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Minimalist warm cream background matching the portfolio aesthetic -->
  <rect width="512" height="512" rx="40" fill="#faf8f3" />
  
  <!-- Interlocking Luxury SS Monogram -->
  <!-- Upper Left S -->
  <text
    x="215"
    y="285"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="290"
    font-weight="600"
    fill="url(#bronze)"
    text-anchor="middle"
    filter="url(#softShadow)"
  >S</text>

  <!-- Lower Right S with clean cream knockout cutout stroke to create interlacing effect -->
  <text
    x="298"
    y="355"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="290"
    font-weight="600"
    fill="url(#bronze)"
    stroke="#faf8f3"
    stroke-width="12"
    stroke-linejoin="round"
    paint-order="stroke fill"
    text-anchor="middle"
    filter="url(#softShadow)"
  >S</text>
</svg>
